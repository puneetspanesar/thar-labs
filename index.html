<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thar Labs | Industry intelligence for India</title>
<meta name="description" content="Industry intelligence for India, from the national total down to a single power station, startup or investor. Every figure dated and sourced.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%23F04A12%22/%3E%3Cpath d=%22M58 18H76L42 82H24Z%22 fill=%22%23FFFAF7%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
/* VOICE: an intelligence desk; numbers first, every figure dated and sourced
   IDEA: search-first home; each industry is a dashboard with its modules on the left; every page ends in a table that opens level by level
   PICTURE: duotone icons on every figure, tile infographics, waffle mixes and black-and-white company logos
   COLOUR and TYPE: Thar orange #F04A12, ink #101010, white and a light card canvas; Google Sans; exact Thar logo
   LAYOUT: top bar; home = centred search and industry grid; inner pages = module menu + workspace of tiles and cards */
:root{--or:#F04A12;--ink:#101010;--bg:#FFFFFF;--cv:#F5F5F3;--line:#E4E4E1}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
:root{--fn:"Google Sans",system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--fn);overflow-x:clip}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
.ic{flex:none;width:20px;height:20px;fill:currentColor;color:var(--or)}
.ic.s{width:16px;height:16px}.ic.m{width:26px;height:26px}.ic.l{width:34px;height:34px}.ic.xl{width:44px;height:44px}
.ic.k{color:var(--ink)}
/* top bar */
header.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--ink)}
.bar{max-width:1480px;margin:0 auto;padding:0 32px;height:66px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:14px;flex:none}
.logo{display:inline-flex;align-items:center;gap:9px}
.logo .wm{font-family:Newsreader,Georgia,serif;font-weight:400;font-variation-settings:'opsz' 72;font-size:30px;letter-spacing:-.03em;line-height:1;transform:translateY(-1px)}
.brand i{width:1px;height:24px;background:var(--ink)}
.brand b{font-size:18px;font-weight:700}
nav.main{display:flex;gap:4px}
nav.main a{display:flex;align-items:center;gap:7px;padding:8px 12px;font-weight:500;font-size:14px;border-radius:8px}
nav.main a:hover{background:var(--cv)}
nav.main a.on{background:var(--ink);color:#fff}
nav.main a.on .ic{color:#fff}
.srch{position:relative;margin-left:auto;width:min(360px,32vw)}
.srch input{width:100%;height:40px;border:1px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);padding:0 12px 0 38px;font:inherit;font-size:14px}
.srch input::placeholder,.hs input::placeholder{color:var(--ink);opacity:1}
.srch input:focus,.hs input:focus{outline:2px solid var(--or);outline-offset:1px}
.srch>.ic{position:absolute;left:11px;top:11px;width:18px;height:18px}
.res{position:absolute;top:46px;left:0;right:0;background:#fff;border:1px solid var(--ink);border-radius:12px;padding:6px;display:none;max-height:420px;overflow:auto;z-index:50}
.res.on{display:block}
.res a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:14px}
.res a span{flex:1}
.res a:hover,.res a:focus{background:var(--ink);color:#fff;outline:none}
.res a:hover .ic,.res a:focus .ic{color:#fff}
.res small{font-size:12px;white-space:nowrap;font-weight:700;color:var(--or)}
.res a:hover small,.res a:focus small{color:#fff}
/* home */
.home{max-width:1480px;margin:0 auto;padding:0 32px 72px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:72px 0 28px;gap:16px}
.hero h1{margin:0;font-size:48px;line-height:1.06;letter-spacing:-.03em;max-width:20ch}
.hero p{margin:0;font-size:17px;max-width:62ch}
.hs{position:relative;width:min(780px,100%);margin-top:10px}
.hs input{width:100%;height:62px;border:1.5px solid var(--ink);border-radius:14px;padding:0 20px 0 56px;font:inherit;font-size:18px;background:#fff}
.hs>.ic{position:absolute;left:18px;top:19px;width:24px;height:24px}
.hs .res{top:70px;text-align:left}
.types{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.types button{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 14px;border:1px solid var(--ink);border-radius:9px;background:#fff;font-size:14px;font-weight:700}
.types button.on{background:var(--ink);color:#fff}
.types button.on .ic{color:#fff}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin:26px 0 8px}
.st{border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px;background:#fff}
.st b{font-size:26px;letter-spacing:-.02em;line-height:1.1}
.st span{font-size:13px;font-weight:500}
.sh{display:flex;justify-content:space-between;align-items:baseline;margin:44px 0 16px}
.sh h2{margin:0;font-size:26px;letter-spacing:-.02em}
.sh span{font-size:14px;font-weight:700}
.igrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.ind{border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;min-height:200px;background:#fff}
.ind.live{border:1.5px solid var(--ink)}
.ind.live:hover{background:var(--ink);color:#fff}
.ind.live:hover .ic,.ind.live:hover .tag{color:#fff}
.ind .top{display:flex;justify-content:space-between;align-items:flex-start}
.tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--or)}
.ind .tag.k{color:var(--ink)}
.ind b.n{font-size:19px;line-height:1.2}
.ind .ft{margin-top:auto;font-size:13px;line-height:1.55}
.ind .mods{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:700}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.how div{border-top:1.5px solid var(--ink);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.how b{font-size:16px}.how p{margin:0;font-size:14px}
/* inner layout */
.app{max-width:1480px;margin:0 auto;padding:0 32px;display:grid;grid-template-columns:236px minmax(0,1fr);gap:32px}
aside.mods{padding:18px 0 24px}
.mods .ttl{display:flex;align-items:center;gap:10px;padding:0 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.mods .ttl b{font-size:15px;line-height:1.25}
.mods nav a{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:8px;font-size:14px}
.mods nav a:hover{background:var(--cv)}
.mods nav a.on{background:var(--ink);color:#fff;font-weight:700}
.mods nav a.on .ic{color:#fff}
.mods nav a small{margin-left:auto;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

aside.mods{position:sticky;top:66px;align-self:start;max-height:calc(100vh - 66px);overflow-y:auto;scrollbar-width:thin}
.nxt{margin-top:12px;border-top:1px solid var(--ink);padding:10px 0 0}
.nxt .hd{display:flex;align-items:center;gap:8px;padding:0 10px 8px;font-size:13px;font-weight:700}
.nxt .hd span{margin-left:auto;font-size:12px}
.nxt a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:4px 10px;border-radius:8px;font-size:13px}
.nxt a:hover{background:#FFF3EE}
.nxt a i{font-style:normal;font-size:11px;font-weight:700;color:var(--or)}
.nxt a u{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nxt a b{font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.nxt .all{display:block;width:100%;margin-top:6px;text-align:left;border:0;background:none;padding:6px 10px;font-size:13px;font-weight:700;color:var(--or);text-decoration:underline;text-underline-offset:3px}
.nxt .up{border-bottom:1px solid var(--line);margin-bottom:4px;padding-bottom:10px}
main a,main tr.lk td:first-child,main .all{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
main .rt a{text-decoration:none}
main .rt a .wmk,main .rt a .lk2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;color:var(--or)}
main .crumb a.cur{text-decoration:none}
.mnext{display:none}
main{padding:22px 0 72px}
#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;border-radius:10px;padding:9px 12px;font-size:13px;line-height:1.45;max-width:280px;display:none}
#tip b{display:block;font-size:13px;margin-bottom:2px;color:#fff}
#tip span{display:block}
.hv .xh{opacity:0}.hv:hover .xh{opacity:1}
.hb2:hover{opacity:.75}
.wfg i:hover{outline:2px solid var(--ink);outline-offset:1px}
.wfl div:hover{background:#FFF3EE}
.rt>div:hover{border-color:var(--ink)}
td[data-tip]:hover{outline:2px solid var(--ink);outline-offset:-2px}
.cv{min-height:0}
.crumb{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13px;margin-bottom:14px}
.crumb a{display:inline-flex;align-items:center;gap:6px}
.crumb a:hover{color:var(--or)}
.crumb .n{font-weight:700;font-size:11px;border:1px solid var(--ink);border-radius:5px;padding:2px 4px}
.crumb .cur{font-weight:700}
.crumb .cur .n{background:var(--or);border-color:var(--or);color:#fff}
.ph{display:flex;justify-content:space-between;align-items:flex-start;gap:28px;margin-bottom:18px}
.ph .kd{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--or)}
.ph h1{margin:6px 0 0;font-size:32px;line-height:1.12;letter-spacing:-.025em;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ph h1 img{height:34px;width:auto}
.ph p{margin:8px 0 0;font-size:15px;max-width:76ch}
.meta{display:grid;grid-template-columns:repeat(3,auto);border:1px solid var(--line);border-radius:12px;flex:none;background:#fff}
.meta div{padding:9px 14px;border-left:1px solid var(--line);display:flex;align-items:center;gap:8px}
.meta div:first-child{border-left:0}
.meta small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.meta b{font-size:14px;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:start;background:#fff;position:relative;overflow:hidden}
.kpi .ic{grid-row:1/4;margin-top:2px}
.kpi p{margin:0;font-size:12px;font-weight:700}
.kpi b{font-size:24px;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi b small{font-size:13px;font-weight:500;margin-left:4px;letter-spacing:0}
.kpi em{font-style:normal;font-size:12px}
.kpi svg.spk{position:absolute;right:12px;bottom:12px;width:30%;height:30px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
.blk{border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;min-width:0}
.blk.w{grid-column:1/-1}
.blk>header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.blk h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.blk .r{display:flex;align-items:center;gap:10px;font-size:12px;white-space:nowrap}
.csv{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:700;font-size:12px;padding:3px 8px}
.csv:hover{border-color:var(--ink)}
.bd{padding:14px 16px;flex:1;display:flex;flex-direction:column}
.cv{width:100%;flex:1;min-height:220px;position:relative}
.cv svg{display:block;width:100%;height:100%;overflow:visible}
.note{font-size:12px;margin:10px 0 0}
.src[hidden]{display:none!important}.src{font-size:12px;padding:8px 16px;border-top:1px solid var(--line);display:flex;gap:6px;align-items:flex-start}
.leg{display:flex;gap:14px;font-size:12px;margin:0 0 6px;flex-wrap:wrap}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* tables */
.tb{overflow:auto;max-height:480px;margin:-14px -16px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:700;padding:8px 12px;background:#fff;border-bottom:1px solid var(--ink);white-space:nowrap;position:sticky;top:0;z-index:1;font-size:12px}
td{padding:7px 12px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.hid{display:none}.tb.open tr.hid{display:table-row}.more{display:block;margin:10px 16px 14px;border:1px solid var(--ink);background:#fff;padding:7px 12px;font-weight:700;font-size:13px}.tb.open .more{display:none}
tr.lk{cursor:pointer}
tr.lk td:first-child{font-weight:700;color:var(--or)}
tr.lk td:first-child .ic{width:12px;height:12px;vertical-align:-1px}
tr.lk:hover td{background:#FFF3EE}
.ht td{border-bottom:1px solid #fff}
/* rank tiles */
.rt{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rt>*{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:112px;position:relative}
.rt a:hover{border-color:var(--ink)}
.rt>*>.wmk:nth-child(2),.rt .lg{padding-right:22px}.rt .rk{position:absolute;top:10px;right:12px;font-size:12px;font-weight:700;color:var(--or)}
.rt .lg{height:30px;display:flex;align-items:center}
.rt .lg img{max-height:26px;max-width:100%}
.wmk{font-weight:700;font-size:15px;line-height:1.15;letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rt .v{margin-top:auto;font-size:18px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rt .v small{font-size:12px;font-weight:500;margin-left:3px;letter-spacing:0}
.rt .meter{height:5px;background:var(--cv);border-radius:3px;overflow:hidden}
.rt .meter i{display:block;height:100%;background:var(--or)}
/* waffle */
.wf{display:grid;grid-template-columns:minmax(0,220px) minmax(0,440px);gap:20px;align-items:center}
.wfg{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.wfg i{aspect-ratio:1;border-radius:3px;border:1px solid var(--ink)}
.wfl{display:flex;flex-direction:column;gap:7px;font-size:13px}
.wfl div{display:grid;grid-template-columns:14px 1fr auto auto;gap:8px;align-items:center}
.wfl s{width:12px;height:12px;border-radius:3px;border:1px solid var(--ink);text-decoration:none}
.wfl b{font-variant-numeric:tabular-nums}
.wfl .v{text-align:right;font-variant-numeric:tabular-nums}
/* log, facts, matrix */
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:28px 140px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.log li:last-child{border-bottom:0}
.log time{font-weight:700}
.log b{display:block}
.log a b{color:var(--or)}
.fx{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin:0}
.fx div{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;gap:10px}
.fx dt{font-size:12px;font-weight:700}
.fx dd{margin:2px 0 0;font-size:14px}
.mx{display:grid;gap:5px 10px;align-items:center;font-size:13px;max-width:640px}
.mx .hd{font-weight:700;text-align:center}
.mx i{display:block;width:22px;height:22px;border-radius:4px;margin:0 auto;border:1px solid var(--line)}
.mx i.a{background:var(--ink);border-color:var(--ink)}.mx i.b{background:var(--or);border-color:var(--or)}
.mx a{font-weight:700;color:var(--or)}
/* tree */
.tree .row{display:grid;grid-template-columns:minmax(0,1fr) 150px 170px 190px 80px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px}
.tree .row.h{font-size:12px;font-weight:700;border-bottom:1px solid var(--ink);padding:9px 16px}
.tree .nm{display:flex;align-items:center;gap:8px}
.tree .tg{width:22px;height:22px;border:1px solid var(--ink);border-radius:6px;background:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0;flex:none}
.tree .tg:disabled{border-color:var(--line);cursor:default}
.tree .lv{font-size:11px;font-weight:700;color:var(--or);width:30px;flex:none}
.tree .row.open>.nm a{color:var(--or)}.tree .nm a:hover{color:var(--or)}
.tree .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tree .c{text-align:right;font-size:13px}
.tree .go{text-align:right;font-weight:700;color:var(--or);font-size:13px}
.tree .row:hover{background:#FFF8F5}
.sources ol{margin:0;padding:12px 16px 12px 34px;font-size:13px;columns:2;column-gap:32px}
.sources li{margin:0 0 4px;break-inside:avoid;overflow-wrap:anywhere}
footer.ft{border-top:1px solid var(--ink)}
footer.ft .bar{height:auto;padding:20px 32px;font-size:14px;justify-content:space-between;flex-wrap:wrap}
@media (max-width:1180px){.igrid{grid-template-columns:repeat(3,1fr)}.stats{grid-template-columns:repeat(3,1fr)}.kpis{grid-template-columns:repeat(2,1fr)}.meta{display:none}.how{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){
 .bar{padding:0 16px;gap:12px}nav.main{display:none}.srch{width:auto;flex:1}
 .app{display:block;padding:0 16px}aside.mods{padding:10px 0 0;position:sticky;top:66px;z-index:20;background:#fff;max-height:none;overflow:visible;border-bottom:1px solid var(--line)}.nxt{display:none}.mnext{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:25;align-items:center;gap:10px;background:var(--ink);color:#fff;border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;text-align:left}.mnext .ic{color:var(--or)}.mnext span{flex:1}.mnext u{text-underline-offset:3px}main{padding-bottom:90px}.mods .ttl{display:none}.mods nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}.mods nav a{white-space:nowrap;flex:none}.mods nav a small{display:none}
 .home{padding:0 16px 48px}.hero{padding-top:40px}.hero h1{font-size:32px}.igrid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}
 .grid{grid-template-columns:minmax(0,1fr)}.ph{display:block}.ph h1{font-size:26px}
 .tree .row{grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 12px}.tree .row>:nth-child(2),.tree .row>:nth-child(4),.tree .row>:nth-child(5),.tree .nm>.ic{display:none}.tree .nm{gap:6px}.tree .lv{width:auto}
 .wf{grid-template-columns:1fr}.log li{grid-template-columns:28px 1fr}.log time{grid-column:2}.log li>div{grid-column:2}
 .sources ol{columns:1}td{white-space:nowrap}.tree>header{flex-wrap:wrap}.tree>header .r{white-space:normal}
}
@media (max-width:520px){.ind{min-height:0}.ind .ft{margin-top:8px}.wfg{max-width:220px}.igrid,.how{grid-template-columns:1fr}.kpis{grid-template-columns:1fr}.brand b{font-size:16px}.logo .wm{font-size:26px}}

:root{--fn:"Inter",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--line:#DADAD6}
body{font-family:var(--fn);font-size:15px;letter-spacing:-.005em}
.ic{color:var(--ink)}
.srch input,.hs input,.res,.types button,.csv,.tree .tg,.mods nav a,nav.main a,.crumb .n,.meta{border-radius:0!important}
nav.main a.on,.mods nav a.on,.types button.on{background:var(--or);color:#fff}
nav.main a.on .ic,.mods nav a.on .ic,.types button.on .ic{color:#fff}
.kd,.meta small,.mods .ttl b{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.meta{border-color:var(--ink)}.meta b,.kd,.crumb .n,.mods nav a small,.nxt a b,.rk2,.rl b,td.n,th,.sumk dd b,.tree .n,.wfl .v,.wfl b,.st b{font-family:var(--mono);letter-spacing:-.02em}
.ph h1{font-weight:600;letter-spacing:-.03em;font-size:34px}
.ph p{font-size:16px}
/* summary */
.sum{border-top:2px solid var(--ink);padding:18px 0 6px;margin-top:6px}
.sum h2,.faq h2{margin:0 0 14px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.sumg{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:44px}
.sumt p{margin:0 0 12px;font-size:17px;line-height:1.55}
.sumt p:first-child::first-letter{font-weight:700}
.sumk{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:0 28px;align-content:start}
.sumk div{border-top:1px solid var(--line);padding:12px 0}
.sumk dt{font-size:12px;font-weight:600}
.sumk dd{margin:2px 0 0;font-size:13px}.sumk dd b{font-size:24px;font-weight:500}
.sumk dd.sn{font-size:12px}
/* sections without boxes */
.grid{gap:56px 48px;margin-top:40px}
.blk{border:0;border-top:2px solid var(--ink);border-radius:0;background:transparent;padding-top:14px}
.blk>header{border:0;padding:0 0 4px}
.blk h3{font-size:18px;font-weight:600;letter-spacing:-.01em}
.blk .r{font-family:var(--mono)}
.tk{margin:2px 0 14px;font-size:14.5px;line-height:1.55;max-width:72ch}
.bd{padding:0}
.tb{margin:0;max-height:none}
th{background:#fff;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.csv{border:0;padding:0;text-decoration:underline;text-underline-offset:3px;background:none}
/* ranked list */
.rl{list-style:none;margin:0;padding:0}
.rl.two{columns:2;column-gap:44px}
.rl li{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);break-inside:avoid;font-size:14px}
.rk2{font-size:12px;color:var(--or)}
.rl .nm{display:flex;align-items:center;gap:8px;min-width:0}
.rl .nm img{height:16px;max-width:60px}
.rl .nm a,.rl .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .br{height:6px;background:#F1F1EE}.rl .br i{display:block;height:100%;background:var(--or)}
.rl b{font-size:14px;font-weight:500;white-space:nowrap}.rl b small{font-size:11px;font-weight:400}
.rl li:hover{background:#FFF6F2}
/* faq */
.faq{border-top:2px solid var(--ink);margin-top:56px;padding-top:14px}
.faq details{border-bottom:1px solid var(--line);padding:12px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:16px;list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::after{content:'+';font-family:var(--mono);color:var(--or);font-size:18px}
.faq details[open] summary::after{content:'−'}
.faq details p{margin:8px 0 2px;max-width:80ch;font-size:15px;line-height:1.6}
/* tree and sources */
.tree,.sources{border:0!important;border-top:2px solid var(--ink)!important;border-radius:0!important;margin-top:56px!important;background:transparent}
.tree>header,.sources>header{border:0;padding:14px 0 8px}
.tree .row{padding-left:0;padding-right:0}
.sources ol{padding-left:18px}
/* home */
.st{border:0;border-top:2px solid var(--ink);border-radius:0;padding:14px 0}
.stats{gap:24px}
.ind{border:0;border-top:2px solid var(--ink);border-radius:0;padding:16px 0;min-height:0;gap:10px}
.ind.live{border:0;border-top:2px solid var(--or)}
.ind.live:hover{background:transparent;color:var(--ink)}.ind.live:hover .ic{color:var(--ink)}.ind.live:hover b.n{text-decoration:underline}
.igrid{gap:28px 32px}
.hero h1{font-weight:600;letter-spacing:-.04em}
.mnext{border-radius:0!important}
.bar{position:relative}nav.main{position:static}
.ddb{display:flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--ink);background:#fff;font:inherit;font-weight:600;font-size:14px;cursor:pointer;color:var(--ink)}
.ddb.on{background:var(--or);border-color:var(--or);color:#fff}.ddb.on .ic{color:#fff}.ddb .ic{color:var(--or)}
.ddp{position:absolute;left:0;right:0;top:100%;background:#fff;border-bottom:2px solid var(--ink);border-top:1px solid var(--line);padding:24px 32px 28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px 28px;z-index:60}
.ddp[hidden]{display:none}.ddh{grid-column:1/-1;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px}
.ddp a{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.ddp a .ic{color:var(--or)}
.ddp a u{display:block;text-decoration:underline;text-underline-offset:3px;font-weight:600;font-size:15px}.ddp a small{display:block;font-family:var(--mono);font-size:11.5px;margin-top:3px}
.ddp a.on,.ddp a:hover{background:none!important;color:var(--ink)!important}.ddp a.on .ic{color:var(--or)!important}.ddp a.on u,.ddp a:hover u{color:var(--or)}.dds{grid-column:1/-1;margin:14px 0 0;font-size:13.5px}.dds b{margin-right:10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
@media (max-width:1180px){.ddp{grid-template-columns:1fr 1fr}}
@media (max-width:900px){nav.main{display:block!important}.ddb span{display:none}.ddb{padding:9px 10px}.ddp{grid-template-columns:1fr;padding:16px}}
.ilist{border-top:2px solid var(--ink)}
.ir{display:grid;grid-template-columns:34px 230px minmax(0,1fr) 190px 170px 20px;gap:22px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line)}
.ir>.ic:first-child{color:var(--or)}.ir b{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.25}
.ir p{margin:0;font-size:14.5px;line-height:1.5}.irk small{display:block;font-size:12px;font-weight:600}.irk em{font-style:normal;font-family:var(--mono);font-size:18px}.irk i{font-style:normal;font-family:var(--fn);font-size:12px}
.irs .spk2{height:36px}.ir>.ic:last-child{color:var(--or)}.ir:hover b{color:var(--or);text-decoration:underline;text-underline-offset:4px}
@media (max-width:1180px){.ir{grid-template-columns:30px 1fr 170px 20px}.ir p,.irs{display:none}}
@media (max-width:640px){.ir{grid-template-columns:28px 1fr 20px}.irk{display:none}}
.igrid2{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:0;row-gap:0;border-top:2px solid var(--ink)}
.ic2{grid-row:span 6;display:grid;grid-template-rows:subgrid;row-gap:18px;padding:22px 24px 26px;border-right:1px solid var(--line)}
.ic2:first-child{padding-left:0}.ic2:last-child{border-right:0;padding-right:0}
.ih{display:flex;gap:12px;align-items:flex-start}.ih .ic{color:var(--or)}
.ih b{display:block;font-size:20px;font-weight:600;letter-spacing:-.02em;line-height:1.2}.ih small{display:block;font-family:var(--mono);font-size:11.5px;margin-top:3px;white-space:nowrap}
.ih:hover b{text-decoration:underline;text-underline-offset:4px}
.hl{margin:0;font-size:15px;line-height:1.5}
.spw{border-top:1px solid var(--line);padding-top:12px;align-self:start}.spk2{width:100%;height:46px;display:block}.spw span{font-size:12px;display:block;margin-top:6px}
.k2{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:12px;align-self:start}
.k2>div{display:grid;grid-template-rows:2.6em auto}
.k2 dt{font-size:12px;font-weight:600;line-height:1.3;align-self:end}.k2 dd{margin:4px 0 0;font-size:12px}.k2 dd b{font-family:var(--mono);font-size:19px;font-weight:500}
.ml{list-style:none;margin:0;padding:12px 0 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 18px;align-content:start;font-size:14px;line-height:1.4}
.ml li a{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}.ml li a:hover{color:var(--or)}
.go2{align-self:end;display:flex;gap:6px;align-items:center;font-weight:600;color:var(--or)}.go2 .ic{color:var(--or)}
.soon{display:flex;flex-wrap:wrap;gap:10px 26px;align-items:center;border-top:1px solid var(--ink);margin-top:28px;padding-top:14px;font-size:14px}
.soon b{font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-right:8px}.soon span{display:inline-flex;gap:7px;align-items:center}
@media (max-width:1180px){.igrid2{grid-template-columns:1fr 1fr}.ic2{padding:24px 20px!important;border-bottom:1px solid var(--line)}.ic2:nth-child(2n){border-right:0}}
@media (max-width:640px){.igrid2{grid-template-columns:1fr}.ic2{padding:22px 0!important;border-right:0}}
.wfg i{border-radius:0}
@media (max-width:900px){.sumg{grid-template-columns:1fr;gap:16px}.rl.two{columns:1}.blk>header{flex-wrap:wrap;row-gap:6px}.rl li{grid-template-columns:24px minmax(0,1fr) 70px auto}}

 return `<div class="ttl">${ic(N[top].icon,'m')}<b>${esc(N[top].title)}</b></div><nav>`+list.filter(m=>N[m[0]]).map(m=>`<a href="#${m[0]}" class="${m[0]===on?'on':''}">${ic(tic(N[m[0]])=='stack'?N[m[0]].icon||'stack':N[m[0]].icon||tic(N[m[0]]),'s')}${esc(m[1])}${kidsOf(m[0]).length?`<small>${kidsOf(m[0]).length}</small>`:''}</a>`).join('')+`</nav>`}
/* ---------- tree (drill down) ---------- */
function rowHTML(k,depth){const n=N[k],x=n.kpis&&n.kpis[0],kids=kidsOf(k).length;return `<div class="row" data-id="${k}" data-d="${depth}"><span class="nm" style="padding-left:${depth*24}px"><button class="tg" type="button" ${kids?'':'disabled'} aria-label="${kids?'Show the level below':'No level below'}">${kids?'+':'·'}</button><span class="lv">L${pad(chain(k).length)}</span>${ic(tic(n),'s')}<a href="#${k}" style="font-weight:500">${esc(n.title)}</a></span><span>${esc(n.kind)}</span><span class="n">${x?esc(x[1])+(x[2]?' '+esc(x[2]):''):''}</span><span class="c">${x?esc(x[0]):''}</span><a class="go" href="#${k}">Open →</a></div>`}
function kidsOf(id){const n=N[id];return [...new Set([...(n.kids||[]).filter(k=>N[k]),...(KIDS[id]||[])])]}
function treeHTML(id){const kids=kidsOf(id);if(!kids.length)return '';const sorted=kids;
 return `<section class="blk w tree" id="tree" style="margin-top:12px;scroll-margin-top:80px"><header><h3>${ic('tree-structure','s')}Explore below: level ${pad(chain(id).length+1)} and deeper</h3><div class="r"><span>${kids.length} page${kids.length>1?'s':''} · open a row to see what sits under it</span></div></header><div class="row h"><span>Name</span><span>Type</span><span style="text-align:right">Headline</span><span style="text-align:right">Measure</span><span></span></div><div class="tb2">${sorted.slice(0,300).map(k=>rowHTML(k,0)).join('')}</div></section>`}
function wireTree(){document.querySelectorAll('.tree .tg').forEach(bindTg)}
function bindTg(b){if(b.disabled||b._b)return;b._b=1;b.onclick=e=>{e.stopPropagation();const row=b.closest('.row'),id=row.dataset.id,d=+row.dataset.d;if(row.classList.contains('open')){let nx=row.nextElementSibling;while(nx&&+nx.dataset.d>d){const t=nx.nextElementSibling;nx.remove();nx=t}row.classList.remove('open');b.textContent='+';return}
 row.classList.add('open');b.textContent='−';const html=kidsOf(id).slice(0,200).map(k=>rowHTML(k,d+1)).join('');row.insertAdjacentHTML('afterend',html);let nx=row.nextElementSibling;while(nx&&+nx.dataset.d>d){nx.querySelectorAll('.tg').forEach(bindTg);nx=nx.nextElementSibling}}}
/* ---------- pages ---------- */
function crumbHTML(id){const c=chain(id);return c.map((x,i)=>`<a href="#${x.id}" class="${x.id===id?'cur':''}"><span class="n">L${pad(i+1)}</span>${esc(i==0?'Labs':x.title)}</a>`).join(`<span>›</span>`)}
function kpiHTML(n){const b0=(n.blocks||[])[0];const sb=b0&&(b0.t=='line'||b0.t=='bars')&&b0.s&&b0.s[0][1].length>=3&&!/incorporat/i.test(b0.h)?b0:null;return `<div class="kpis">`+n.kpis.map((k,i)=>{const s=i==0?spark(sb):'';return `<div class="kpi">${ic(kicon(k[0]+' '+k[2]),'l')}<p>${esc(k[0])}</p><b>${esc(k[1])}${k[2]?`<small>${esc(k[2])}</small>`:''}</b><em${s?' style="max-width:62%"':''}>${esc(k[3])}</em>${s}</div>`}).join('')+`</div>`}
function page(id){const n=N[id];charts.length=0;const c=chain(id),below=depthBelow(id);n.blocks.forEach(b=>delete b._sum);const sm=summaryHTML(n);
 let blocks=n.blocks.map(blockHTML);let run=0;const W=n.blocks.map(b=>b._w);
 // balance: a lone half-width block before a wide one, or at the end, becomes wide
 let out=[],half=0;n.blocks.forEach((b,i)=>{if(W[i]){if(half%2){out[out.length-1]=out[out.length-1].replace('class="blk"','class="blk w"')}half=0}else half++;out.push(blocks[i])});if(half%2)out[out.length-1]=out[out.length-1].replace('class="blk"','class="blk w"');
 const lg=logo(n.title);
 let h=`<nav class="crumb" aria-label="Path">${crumbHTML(id)}</nav><div class="ph"><div><div class="kd">${ic(tic(n),'s')}${esc(n.kind)} · Level ${pad(c.length)} of ${pad(c.length+below)}</div><h1>${lg?`<img src="${lg[0]}" alt="">`:''}${esc(n.title)}</h1><p>${esc(n.lede)}</p></div><div class="meta"><div>${ic('calendar-blank')}<span><small>Data as of</small><b>${esc(n.asof)}</b></span></div><div>${ic('database')}<span><small>${n.kind==='Industry'?'Data points in this industry':'Data points on this page'}</small><b>${(n.kind==='Industry'?stats(id).p:pts(n)).toLocaleString('en-US')}</b></span></div><div>${ic('seal-check')}<span><small>Sources</small><b>${n.src.length}</b></span></div></div></div>`;
 h+=(sm||kpiHTML(n))+`<div class="grid">${out.join('')}</div>`+faqHTML(n)+treeHTML(id);
 const lk=(n.kids||[]).filter(k=>N[k]&&N[k].parent!==id);
 if(false)h+=`<section class="blk w" style="margin-top:12px"><header><h3>${ic('intersect','s')}Linked pages</h3></header><div class="bd"><div class="rt">${lk.map(k=>`<a href="#${k}"><span class="rk">L${pad(chain(k).length)}</span>${ic(tic(N[k]),'m')}<span class="wmk">${esc(N[k].title)}</span><span style="margin-top:auto;font-size:12px;font-weight:700">${esc(N[k].kind)}</span></a>`).join('')}</div></div></section>`;
 h+=`<section class="blk w sources" style="margin-top:12px"><header><h3>${ic('seal-check','s')}Sources</h3></header><ol>${n.src.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></section>`;
 return h}
function stats(top){let pages=0,p=0,ds=0;Object.values(N).forEach(n=>{if(n.id===''||!n.blocks)return;if(top&&ind(n.id)!==top)return;pages++;p+=pts(n);ds+=n.blocks.length});return {pages,p,ds}}
let FILTER='all';
function home(){const T=stats(),f=x=>x.toLocaleString('en-US');
 const live=INDS.map(([id,t,i])=>{const s=stats(id),n=N[id];let hl=n.hl||'';if(!hl)for(const b of n.blocks){if(b.t=='split')continue;const x=insight(b);if(x&&!/month to date/.test(x)){hl=(b.t=='hbars'?b.h.replace(/,\s*$/,'')+': ':'')+x.split(/(?<=\.)\s/).slice(0,x.length<90?2:1).join(' ');break}}
  const sb=n.blocks.find(b=>(b.t=='line'||b.t=='bars')&&b.s&&b.s[0][1].length>=6);const sp=sb?spark(sb).replace('class="spk"','class="spk2"'):'';
  const k=n.kpis[0];
  return `<a class="ir" href="#${id}">${ic(i,'l')}<b>${esc(t)}</b><p>${esc(hl)}</p><span class="irk"><small>${esc(k[0])}</small><em>${esc(k[1])}${k[2]?` <i>${esc(k[2])}</i>`:''}</em></span><span class="irs">${sp}</span>${ic('arrow-right','s')}</a>`}).join('');
 const soon=!SOON.length?'':`<div class="soon"><b>In research</b>${SOON.map(([t,i])=>`<span>${ic(i,'s')}${esc(t)}</span>`).join('')}</div>`;
 const ty=[['all','Everything','magnifying-glass'],['ind','Industries','squares-four'],['co','Companies','buildings'],['place','Places','map-pin'],['inv','Investors','users-three'],['asset','Power stations','factory']];
 return `<div class="home"><section class="hero"><h1>Find any figure on<br>Indian industry</h1><p>Regulator filings, market data and company disclosures, organised into pages you can drill through, from the national total down to a single plant, startup or investor.</p>
 <div class="hs">${ic('magnifying-glass')}<input id="q2" type="search" placeholder="Search an industry, company, place or investor" autocomplete="off" aria-label="Search Labs"><div class="res" id="res2" role="listbox"></div></div>
 <div class="types" role="group" aria-label="Search in">${ty.map(t=>`<button type="button" data-f="${t[0]}" class="${t[0]==FILTER?'on':''}">${ic(t[2],'s')}${t[1]}</button>`).join('')}</div></section>
 <div class="stats"><div class="st">${ic('database','l')}<b>${f(T.p)}</b><span>data points</span></div><div class="st">${ic('stack','l')}<b>${f(T.pages)}</b><span>pages</span></div><div class="st">${ic('chart-bar','l')}<b>${f(T.ds)}</b><span>datasets</span></div><div class="st">${ic('squares-four','l')}<b>${INDS.length}</b><span>industries live</span></div><div class="st">${ic('seal-check','l')}<b>100%</b><span>figures with a source and date</span></div><div class="st">${ic('tree-structure','l')}<b>${Math.max(...ALL.map(n=>chain(n.id).length))}</b><span>levels on the deepest path</span></div></div>
 <div class="sh"><h2>Industries</h2><span>${INDS.length} industries live</span></div><div class="ilist">${live}</div>${soon}
 <div class="sh"><h2>How Labs works</h2></div><div class="how"><div>${ic('database','l')}<b>Pulled from the source</b><p>Regulators, exchanges and company filings, collected on a schedule.</p></div><div>${ic('stack','l')}<b>One page per thing</b><p>Every state, plant, company and investor gets its own page.</p></div><div>${ic('tree-structure','l')}<b>Open it level by level</b><p>From the national total down to a single asset or deal.</p></div><div>${ic('seal-check','l')}<b>Every figure sourced</b><p>Each number carries its source and the date it describes.</p></div></div></div>`}
/* ---------- search ---------- */
const ALL=Object.values(N).filter(n=>n.id!=='');
const KF={ind:n=>['Industry','Module','Sector','Segment','Technology'].includes(n.kind),co:n=>['Startup','Company','Developer zone','NBFC'].includes(n.kind),place:n=>['State','District','City','Park','Sub-park','RTO'].includes(n.kind),inv:n=>n.kind==='Investor',asset:n=>['Power station','Project'].includes(n.kind)};
function search(v,box){v=v.trim().toLowerCase();if(!v){box.classList.remove('on');return}const f=KF[FILTER]||(()=>true);
 const a=ALL.filter(n=>f(n)&&n.title.toLowerCase().startsWith(v)),b=ALL.filter(n=>f(n)&&!n.title.toLowerCase().startsWith(v)&&n.title.toLowerCase().includes(v));
 const hits=a.concat(b).slice(0,14);box.innerHTML=hits.length?hits.map(n=>`<a href="#${n.id}">${ic(tic(n),'s')}<span>${esc(n.title)}</span><small>${esc(n.kind)} · L${pad(chain(n.id).length)}</small></a>`).join(''):`<a href="#">${ic('info','s')}<span>No match</span><small>Try Mundra, Gujarat, Accel</small></a>`;box.classList.add('on')}
function bindSearch(inp,box){inp.addEventListener('input',()=>search(inp.value,box));inp.addEventListener('keydown',e=>{if(e.key=='Enter'){const a=box.querySelector('a');if(a){location.hash=a.getAttribute('href');box.classList.remove('on');inp.value=''}}if(e.key=='Escape')box.classList.remove('on')});box.addEventListener('click',()=>{box.classList.remove('on');inp.value=''})}
bindSearch($('#q'),$('#res'));
document.addEventListener('click',e=>{if(!e.target.closest('.srch,.hs'))document.querySelectorAll('.res').forEach(r=>r.classList.remove('on'))});
/* ---------- router ---------- */
function go(){const id=decodeURIComponent(location.hash.slice(1));ros.forEach(r=>r.disconnect());ros=[];charts.length=0;const n=N[id];const key=n&&id!==''?id:'';
 {const cur=key&&INDS.find(x=>x[0]===ind(key));$('#topnav').innerHTML=`<button type="button" class="ddb${cur?' on':''}" aria-expanded="false" aria-haspopup="true">${ic(cur?cur[2]:'squares-four','s')}<span>${cur?esc(cur[1]):'Industries'}</span>${ic('caret-down','s')}</button><div class="ddp" hidden><b class="ddh">All industries</b>${INDS.map(([i,t,c])=>`<a href="#${i}" class="${cur&&cur[0]===i?'on':''}">${ic(c,'m')}<span><u>${esc(t)}</u></span></a>`).join('')}${SOON.length?`<p class="dds"><b>In research</b>${SOON.map(s=>esc(s[0])).join(', ')}</p>`:''}</div>`;}
 if(key===''){$('#view').innerHTML=home();document.title='Thar Labs | Industry intelligence for India';
  bindSearch($('#q2'),$('#res2'));document.querySelectorAll('.types button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;document.querySelectorAll('.types button').forEach(x=>x.classList.toggle('on',x===b));const q2=$('#q2');if(q2.value)search(q2.value,$('#res2'));q2.focus()})}
 else{$('#view').innerHTML=`<div class="app"><aside class="mods" aria-label="Modules">${modsHTML(key)}${nextHTML(key)}</aside><main>${page(key)}</main></div>${mnextHTML(key)}`;document.title=n.title+' | Thar Labs';wireTree();{const a=document.querySelector('.mods nav a.on');if(a&&innerWidth<900)a.parentElement.scrollLeft=a.offsetLeft-16}document.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>{const t=document.getElementById('tree');if(t)t.scrollIntoView({behavior:'smooth'})})}
 window.scrollTo(0,0);drawAll();
 document.querySelectorAll('.csv').forEach(btn=>btn.onclick=()=>{const bl=N[key].blocks[+btn.dataset.b];let rows=[];if(bl.c)rows=[bl.c,...bl.r];else if(bl.s)rows=[['',...bl.s.map(x=>x[0])],...bl.x.map((x,i)=>[x,...bl.s.map(s=>s[1][i])])];else if(bl.v)rows=[['',...bl.cols],...bl.rows.map((r,i)=>[r,...bl.v[i]])];else rows=[['Item','Value'],...bl.r.map(r=>[r[0],Array.isArray(r[1])?r[1].join(' '):r[1]])];const csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=(bl.h||'data').replace(/[^\w ]+/g,'').trim()+'.csv';document.body.appendChild(a);a.click();a.remove()});
 document.querySelectorAll('.more').forEach(m=>m.onclick=()=>m.closest('.tb').classList.add('open'));document.querySelectorAll('tr.lk').forEach(t=>{const f=()=>location.hash=t.dataset.h;t.onclick=f;t.onkeydown=e=>{if(e.key=='Enter')f()}})}
addEventListener('hashchange',go);go();
(()=>{const T=document.getElementById('tip');let cur=null;
 const show=(el,e)=>{const p=el.getAttribute('data-tip').split('|');T.innerHTML=`<b>${p[0]}</b>${p.slice(1).map(x=>`<span>${x}</span>`).join('')}`;T.style.display='block';move(e)};
 const move=e=>{const w=T.offsetWidth,h=T.offsetHeight;let x=e.clientX+14,y=e.clientY+14;if(x+w>innerWidth-8)x=e.clientX-w-14;if(y+h>innerHeight-8)y=e.clientY-h-14;T.style.left=x+'px';T.style.top=y+'px'};
 document.addEventListener('mouseover',e=>{const el=e.target.closest('[data-tip]');if(el!==cur){cur=el;if(el)show(el,e);else T.style.display='none'}});
 document.addEventListener('mousemove',e=>{if(cur)move(e)});
 addEventListener('scroll',()=>{T.style.display='none';cur=null},{passive:true})})();
</script>
